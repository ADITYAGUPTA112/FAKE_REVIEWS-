<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrustLens</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      width: 360px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background: #111827;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    .muted { color: #94a3b8; font-size: 12px; }
    .trust { font-size: 20px; font-weight: 700; margin: 4px 0; }
    .status { font-size: 12px; color: #fbbf24; }
    #trendWrap { height: 210px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="title">TrustLens Product Snapshot</p>
    <div id="productMeta" class="muted">Detecting product...</div>
    <div id="trustScore" class="trust">-</div>
    <div id="ratingMeta" class="muted">-</div>
    <div id="status" class="status">Loading...</div>
  </div>

  <div class="card">
    <p class="title">12-Month Trust Trend</p>
    <div id="trendWrap">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
