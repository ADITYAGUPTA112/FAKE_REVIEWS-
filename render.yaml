# render.yaml — Render deployment configuration for TrustLens AI
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: trustlens-ai
    env: python
    region: singapore          # Closest to India
    plan: free
    buildCommand: "pip install -r requirements.txt && python download_models.py"
    startCommand: "gunicorn app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FIREBASE_WEB_API_KEY
        sync: false            # Set manually in Render dashboard → won't be in git
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MODEL_ACCURACY
        value: "92.0"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false            # Paste full Firebase service account JSON as a single env var
