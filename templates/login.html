<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | TrustLens AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#26eded",
                        "background-light": "#f6f8f6",
                        "background-dark": "#000000",
                        "card-dark": "#0a0a0a"
                    },
                    fontFamily: { "display": ["Inter"] },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }</script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .neon-glow {
            box-shadow: 0 0 15px rgba(38, 237, 237, 0.3);
        }
    </style>
</head>

<body
    class="bg-background-light text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display dark:bg-background-dark">
    <header
        class="w-full border-b border-primary/10 px-6 py-4 flex items-center justify-between backdrop-blur-md sticky top-0 z-50 dark:bg-background-dark/50">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">shield_with_heart</span>
            <h1 class="text-xl font-bold tracking-tight">TrustLens AI</h1>
        </div>
        <a class="text-sm font-medium hover:text-primary transition-colors"
            href="{{ url_for('register') }}">Register</a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12 relative overflow-hidden">
        <div class="absolute top-1/4 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 -right-24 w-80 h-80 bg-primary/5 rounded-full blur-[100px]"></div>
        <div class="w-full max-w-[440px] z-10">
            <div
                class="bg-white backdrop-blur-xl border border-slate-200 dark:border-white/5 p-8 rounded-xl shadow-2xl dark:bg-card-dark">
                <div class="mb-8 text-center md:text-left">
                    <h2 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white mb-2">Welcome Back</h2>
                    <p class="text-slate-600 dark:text-primary/70 text-sm font-medium">Log in to your TrustLens AI
                        dashboard</p>
                </div>
                <div class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm"
                    id="error-box"></div>
                <form class="space-y-6" id="login-form">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-700 dark:text-slate-300 ml-1" for="email">Email
                            Address</label>
                        <div class="relative group">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">mail</span>
                            <input
                                class="w-full pl-12 pr-4 h-14 bg-slate-50 dark:bg-black/30 border border-slate-200 dark:border-primary/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 text-slate-900 dark:text-white"
                                id="email" placeholder="name@company.com" required type="email" />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-700 dark:text-slate-300"
                            for="password">Password</label>
                        <div class="relative group">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
                            <input
                                class="w-full pl-12 pr-4 h-14 bg-slate-50 dark:bg-black/30 border border-slate-200 dark:border-primary/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 text-slate-900 dark:text-white"
                                id="password" placeholder="••••••••" required type="password" />
                            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary"
                                onclick="togglePass('password')" type="button">
                                <span class="material-symbols-outlined text-lg">visibility</span>
                            </button>
                        </div>
                    </div>
                    <button
                        class="w-full h-14 bg-primary text-background-dark font-black rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 neon-glow"
                        id="login-btn" type="submit">
                        <span id="login-btn-text">Login to Dashboard</span>
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
                    </button>
                </form>
                <div class="mt-6 flex items-center gap-4">
                    <div class="flex-1 border-t border-slate-200 dark:border-primary/20"></div>
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">OR</span>
                    <div class="flex-1 border-t border-slate-200 dark:border-primary/20"></div>
                </div>
                <button type="button" id="google-login-btn" class="mt-6 w-full h-14 bg-white dark:bg-card-dark border border-slate-200 dark:border-primary/20 text-slate-900 dark:text-white font-bold rounded-lg hover:bg-slate-50 dark:hover:bg-black/30 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
                <div class="mt-6 pt-6 border-t border-slate-100 dark:border-primary/10 text-center">
                    <p class="text-slate-500 dark:text-slate-400 text-sm mb-4">
                        Don't have an account? <a class="text-primary font-bold hover:underline ml-1"
                            href="{{ url_for('register') }}">Register now</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full px-6 py-6 text-center">
        <p class="text-xs font-bold tracking-widest text-slate-400 uppercase opacity-50">© 2024 TrustLens AI. All
            Intelligence Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "{{ firebase_api_key | default('') }}",
            authDomain: "fake-reviews-94913.firebaseapp.com",
            projectId: "fake-reviews-94913",
        };

        let app, auth;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
        } catch (e) { console.warn('Firebase init failed:', e); }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.classList.remove('hidden');
        }

        window.togglePass = function (id) {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        };

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('login-btn-text');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btnText.textContent = 'Logging in...';
            document.getElementById('error-box').classList.add('hidden');

            if (!auth) {
                showError('Firebase not configured. Please add your API key.');
                btn.disabled = false; btnText.textContent = 'Login to Dashboard'; return;
            }

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const idToken = await cred.user.getIdToken();
                const res = await fetch('/api/sessionLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idToken,
                        email: cred.user && cred.user.email ? cred.user.email : email,
                        displayName: cred.user && cred.user.displayName ? cred.user.displayName : '',
                        photoURL: cred.user && cred.user.photoURL ? cred.user.photoURL : ''
                    })
                });
                if (res.ok) { window.location.href = '/'; }
                else { const d = await res.json(); showError(d.error || 'Login failed.'); }
            } catch (err) {
                const msgs = {
                    'auth/invalid-credential': 'Invalid email or password.',
                    'auth/user-not-found': 'No account with this email.',
                    'auth/wrong-password': 'Incorrect password.',
                    'auth/too-many-requests': 'Too many attempts. Try later.',
                };
                showError(msgs[err.code] || err.message);
            }
            btn.disabled = false;
            btnText.textContent = 'Login to Dashboard';
        });

        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const btn = document.getElementById('google-login-btn');
            btn.disabled = true;
            document.getElementById('error-box').classList.add('hidden');

            if (!auth) {
                showError('Firebase not configured. Please add your API key.');
                btn.disabled = false; return;
            }

            try {
                const provider = new GoogleAuthProvider();
                const cred = await signInWithPopup(auth, provider);
                const idToken = await cred.user.getIdToken();
                const res = await fetch('/api/sessionLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idToken,
                        email: cred.user && cred.user.email ? cred.user.email : '',
                        displayName: cred.user && cred.user.displayName ? cred.user.displayName : '',
                        photoURL: cred.user && cred.user.photoURL ? cred.user.photoURL : ''
                    })
                });
                if (res.ok) { window.location.href = '/'; }
                else { const d = await res.json(); showError(d.error || 'Login failed.'); btn.disabled = false; }
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(err.message || 'Google login failed.');
                }
                btn.disabled = false;
            }
        });

        document.getElementById('forgot-password').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError('Please enter your email address above first.');
                return;
            }
            if (!auth) return;
            try {
                await sendPasswordResetEmail(auth, email);
                alert('Password reset link sent! Please check your email inbox.');
            } catch (err) {
                showError(err.message || 'Failed to send password reset email.');
            }
        });
    </script>
</body>

</html>
