<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Clearance - TrustLens AI</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        heading: ['"Syne"', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            dark: '#0a0f1c',
                            card: 'rgba(10, 15, 28, 0.8)',
                            amber: '#f59e0b',
                            amberDark: '#b45309'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0f1c;
            color: #cbd5e1;
            /* Cyber Grid Pattern */
            background-image:
                linear-gradient(rgba(245, 158, 11, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 158, 11, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, #0a0f1c 80%);
            pointer-events: none;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(10, 15, 28, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.1);
        }

        .input-dark {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            font-family: 'Space Mono', monospace;
            transition: all 0.2s ease;
        }

        .input-dark::placeholder {
            color: rgba(245, 158, 11, 0.3);
        }

        .input-dark:focus {
            background: rgba(245, 158, 11, 0.05);
            border-color: #f59e0b;
            box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.5);
            outline: none;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            color: #0a0f1c;
            border: 1px solid #fbbf24;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .btn-gradient:hover {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            color: #000;
        }

        /* Typewriter Animation */
        .typewriter-container {
            display: inline-block;
        }

        .typewriter-text {
            overflow: hidden;
            white-space: nowrap;
            margin: 0 auto;
            letter-spacing: .15em;
            border-right: 3px solid #f59e0b;
            animation:
                typing 1.5s steps(22, end),
                blink-caret .75s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        @keyframes blink-caret {

            from,
            to {
                border-color: transparent
            }

            50% {
                border-color: #f59e0b;
            }
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(245, 158, 11, 0.3);
            opacity: 0.4;
            animation: scan 6s linear infinite;
            z-index: 50;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center relative">

    <div class="scanline"></div>

    <!-- Register Container -->
    <div class="w-full max-w-md p-8 glass-panel border-t-4 border-t-amber-500 rounded relative z-10 m-4">

        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center space-x-3 mb-6">
                <div
                    class="w-12 h-12 rounded bg-gradient-to-br from-amber-600 to-amber-400 flex items-center justify-center shadow-[0_0_15px_rgba(245,158,11,0.5)]">
                    <i class="ph-fill ph-fingerprint text-brand-dark text-3xl"></i>
                </div>
            </div>

            <div class="typewriter-container">
                <h1
                    class="typewriter-text text-xl md:text-2xl font-bold text-amber-500 font-mono tracking-widest uppercase">
                    CLEARANCE PROTOCOL</h1>
            </div>
            <p class="text-slate-500 text-xs font-mono uppercase tracking-widest mt-3">Register new operative
                credentials</p>
        </div>

        {% if error %}
        <div class="mb-5 bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded relative flex items-center shadow-sm font-mono text-xs uppercase tracking-widest"
            role="alert">
            <i class="ph ph-warning-circle text-lg mr-3 animate-pulse"></i>
            <span class="block sm:inline font-bold">AUTH_FAIL: {{ error }}</span>
        </div>
        {% endif %}

        <form id="register-form" class="space-y-4">

            <div>
                <label for="name"
                    class="block text-[10px] font-bold text-amber-500/70 mb-1 font-mono uppercase tracking-widest">Operative
                    Alias</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-user text-amber-500/50 text-lg"></i>
                    </div>
                    <input type="text" id="name" name="name"
                        class="input-dark block w-full pl-10 pr-3 py-3 rounded sm:text-sm" placeholder="Agent Rivera"
                        required>
                </div>
            </div>

            <div>
                <label for="email"
                    class="block text-[10px] font-bold text-amber-500/70 mb-1 font-mono uppercase tracking-widest">Agent
                    ID [Email]</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-envelope text-amber-500/50 text-lg"></i>
                    </div>
                    <input type="email" id="email" name="email"
                        class="input-dark block w-full pl-10 pr-3 py-3 rounded sm:text-sm"
                        placeholder="agent@trustlens.ai" required>
                </div>
            </div>

            <div>
                <label for="password"
                    class="block text-[10px] font-bold text-amber-500/70 mb-1 font-mono uppercase tracking-widest">Passcode</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-lock-key text-amber-500/50 text-lg"></i>
                    </div>
                    <input type="password" id="password" name="password"
                        class="input-dark block w-full pl-10 pr-3 py-3 rounded sm:text-sm" placeholder="••••••••"
                        required>
                </div>
            </div>

            <div>
                <label for="confirm_password"
                    class="block text-[10px] font-bold text-amber-500/70 mb-1 font-mono uppercase tracking-widest">Verify
                    Passcode</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-lock-key text-amber-500/50 text-lg"></i>
                    </div>
                    <input type="password" id="confirm_password" name="confirm_password"
                        class="input-dark block w-full pl-10 pr-3 py-3 rounded sm:text-sm" placeholder="••••••••"
                        required>
                </div>
            </div>

            <button type="submit"
                class="btn-gradient w-full flex justify-center py-3 px-4 rounded text-sm shadow-lg focus:outline-none mt-6">
                <span>Request Access</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-amber-500/20 pt-6">
            <p class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">
                Already have clearance?
                <a href="{{ url_for('login') }}"
                    class="font-bold text-amber-500 hover:text-amber-400 transition-colors ml-1 border-b border-amber-500/30 pb-0.5">Access
                    Terminal</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFZukdrr5sehQ2NRvtrzRnIm0qog2AiDQ",
            authDomain: "fake-reviews-94913.firebaseapp.com",
            projectId: "fake-reviews-94913",
            storageBucket: "fake-reviews-94913.firebasestorage.app",
            messagingSenderId: "105585292004",
            appId: "1:105585292004:web:e46524076707170c5df2f1",
            measurementId: "G-JQDBMQT5CV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                showError("Passcodes do not match!");
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;

            submitBtn.innerHTML = '<span>Processing request...</span>';
            submitBtn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                const idToken = await userCredential.user.getIdToken();

                // Send token to backend
                const response = await fetch('/api/sessionLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: idToken })
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    showError('Session initialization failed. Please try again.');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error("Registration Error:", error);
                showError(error.message.replace("Firebase: ", ""));
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        function showError(msg) {
            let errorHtml = `
            <div class="mb-5 bg-red-500/10 border border-red-500/50 text-red-500 px-4 py-3 rounded relative flex items-center shadow-sm font-mono text-xs uppercase tracking-widest" role="alert">
                <i class="ph ph-warning-circle text-lg mr-3 animate-pulse"></i>
                <span class="block sm:inline font-bold">AUTH_FAIL: ${msg}</span>
            </div>`;

            const form = document.getElementById('register-form');
            const previousErrors = form.parentNode.querySelectorAll('div[role="alert"]');
            previousErrors.forEach(err => err.remove());
            form.insertAdjacentHTML('beforebegin', errorHtml);
        }
    </script>
</body>

</html>
