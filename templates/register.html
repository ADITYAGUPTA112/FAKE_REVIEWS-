<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register | TrustLens AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#26eded",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0a0a0a",
                        "card-dark": "#1a1a1a",
                    },
                    fontFamily: { "display": ["Inter"] },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <header class="flex items-center justify-between border-b border-primary/10 px-6 py-4 lg:px-20">
                <a href="{{ url_for('index') }}" class="flex items-center gap-3 cursor-pointer group">
                    <div class="size-8 flex items-center justify-center bg-primary/10 rounded-lg text-primary">
                        <span class="material-symbols-outlined text-2xl">lens_blur</span>
                    </div>
                    <h2 class="text-xl font-bold leading-tight tracking-tight group-hover:text-primary transition-colors">TrustLens AI</h2>
                </a>
                <nav class="hidden md:flex gap-6">
                    <a class="text-sm font-medium hover:text-primary transition-colors" href="{{ url_for('index') }}">Home</a>
                    <a class="text-sm font-medium hover:text-primary transition-colors" href="{{ url_for('analyze') }}">Analyze</a>
                </nav>
            </header>

            <main class="flex flex-1 items-center justify-center p-6">
                <div class="w-full max-w-[480px] space-y-8">
                    <div class="text-center space-y-2">
                        <h1 class="text-4xl font-black tracking-tight text-slate-900 dark:text-white">Create Account</h1>
                        <p class="text-slate-600 dark:text-primary/60 text-base">Join the future of AI transparency</p>
                    </div>

                    <div class="bg-slate-100 dark:bg-white/5 p-8 rounded-xl border border-slate-200 dark:border-primary/10 shadow-xl backdrop-blur-sm dark:bg-card-dark">
                        <div class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm" id="error-box"></div>
                        <form class="space-y-5" id="register-form">
                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="full-name">Full Name</label>
                                <div class="relative">
                                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                                    <input id="full-name" required type="text" placeholder="John Doe"
                                        class="w-full pl-12 pr-4 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                                </div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="email">Email Address</label>
                                <div class="relative">
                                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                                    <input id="email" required type="email" placeholder="name@example.com"
                                        class="w-full pl-12 pr-4 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                                </div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="password">Password</label>
                                <div class="relative flex items-center">
                                    <span class="material-symbols-outlined absolute left-4 text-slate-400 text-xl">lock</span>
                                    <input id="password" required type="password" placeholder="********"
                                        class="w-full pl-12 pr-12 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                                    <button class="absolute right-4 text-slate-400 hover:text-primary transition-colors" onclick="togglePass('password')" type="button">
                                        <span class="material-symbols-outlined text-xl">visibility</span>
                                    </button>
                                </div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="confirm-password">Confirm Password</label>
                                <div class="relative flex items-center">
                                    <span class="material-symbols-outlined absolute left-4 text-slate-400 text-xl">shield_lock</span>
                                    <input id="confirm-password" required type="password" placeholder="********"
                                        class="w-full pl-12 pr-12 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" />
                                    <button class="absolute right-4 text-slate-400 hover:text-primary transition-colors" onclick="togglePass('confirm-password')" type="button">
                                        <span class="material-symbols-outlined text-xl">visibility</span>
                                    </button>
                                </div>
                            </div>

                            <button id="register-btn" type="submit"
                                class="w-full py-4 px-6 bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 group">
                                <span id="register-btn-text">Create Account</span>
                                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                            </button>
                        </form>
                        <div class="mt-6 flex items-center gap-4">
                            <div class="flex-1 border-t border-slate-200 dark:border-primary/20"></div>
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">OR</span>
                            <div class="flex-1 border-t border-slate-200 dark:border-primary/20"></div>
                        </div>
                        <button type="button" id="google-register-btn" class="mt-6 w-full py-4 px-6 bg-white dark:bg-card-dark border border-slate-300 dark:border-primary/20 text-slate-900 dark:text-white font-bold text-lg rounded-lg hover:bg-slate-50 dark:hover:bg-black/30 active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50">
                            <div id="google-spinner" class="hidden w-6 h-6 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
                            <svg id="google-icon" class="w-6 h-6" viewBox="0 0 24 24">
                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                            </svg>
                            <span id="google-text">Continue with Google</span>
                        </button>

                        <div class="mt-8 pt-6 border-t border-slate-200 dark:border-primary/10 text-center">
                            <p class="text-slate-600 dark:text-slate-400 text-sm">
                                Already have an account?
                                <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="{{ url_for('login') }}">Login here</a>
                            </p>
                        </div>
                    </div>

                    <p class="text-center text-xs text-slate-500 dark:text-slate-600 max-w-xs mx-auto">
                        By clicking register, you agree to our
                        <a class="underline" href="#">Terms of Service</a> and
                        <a class="underline" href="#">Privacy Policy</a>.
                    </p>
                </div>
            </main>

            <footer class="p-6 text-center">
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-primary/5 rounded-full border border-primary/10">
                    <div class="size-2 bg-primary rounded-full animate-pulse"></div>
                    <span class="text-[10px] uppercase tracking-widest font-bold text-primary/80">Secured by TrustLens Protocol</span>
                </div>
            </footer>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
        <div class="absolute top-[20%] -right-[5%] w-[30%] h-[50%] bg-primary/5 blur-[100px] rounded-full"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "{{ firebase_api_key | default('') }}",
            authDomain: "fake-reviews-94913.firebaseapp.com",
            projectId: "fake-reviews-94913",
        };

        let fbApp, auth;
        try {
            fbApp = initializeApp(firebaseConfig);
            auth = getAuth(fbApp);
        } catch (e) {
            console.warn("Firebase init failed:", e);
        }

        function showError(msg) {
            const box = document.getElementById("error-box");
            box.textContent = msg;
            box.classList.remove("hidden");
        }

        function hideError() {
            document.getElementById("error-box").classList.add("hidden");
        }

        window.togglePass = function (id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.type = el.type === "password" ? "text" : "password";
        };

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            hideError();

            const btn = document.getElementById("register-btn");
            const btnText = document.getElementById("register-btn-text");
            const fullName = String(document.getElementById("full-name").value || "").trim();
            const email = String(document.getElementById("email").value || "").trim();
            const password = String(document.getElementById("password").value || "");
            const confirmPassword = String(document.getElementById("confirm-password").value || "");

            if (!fullName) {
                showError("Please enter your full name.");
                return;
            }
            if (password.length < 6) {
                showError("Password must be at least 6 characters.");
                return;
            }
            if (password !== confirmPassword) {
                showError("Password and confirm password do not match.");
                return;
            }
            if (!auth) {
                showError("Firebase not configured. Please add your API key.");
                return;
            }

            btn.disabled = true;
            btnText.textContent = "Creating account...";
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                try {
                    await updateProfile(cred.user, { displayName: fullName });
                } catch (e) {
                    console.warn("Profile update skipped:", e);
                }

                const idToken = await cred.user.getIdToken();
                const res = await fetch("/api/sessionLogin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        idToken,
                        email: cred.user && cred.user.email ? cred.user.email : email,
                        displayName: fullName || (cred.user && cred.user.displayName ? cred.user.displayName : ""),
                        photoURL: cred.user && cred.user.photoURL ? cred.user.photoURL : "",
                    }),
                });

                if (res.ok) {
                    window.location.href = "/";
                    return;
                }
                const data = await res.json().catch(() => ({}));
                showError(data.error || "Account created, but login failed. Please login manually.");
            } catch (err) {
                const msgs = {
                    "auth/email-already-in-use": "This email is already registered.",
                    "auth/invalid-email": "Please enter a valid email address.",
                    "auth/weak-password": "Password is too weak.",
                    "auth/too-many-requests": "Too many attempts. Try later.",
                };
                showError(msgs[err.code] || err.message || "Registration failed.");
            } finally {
                btn.disabled = false;
                btnText.textContent = "Create Account";
            }
        });

        document.getElementById('google-register-btn').addEventListener('click', async () => {
            const btn = document.getElementById('google-register-btn');
            const spinner = document.getElementById('google-spinner');
            const icon = document.getElementById('google-icon');
            const text = document.getElementById('google-text');

            if (btn.disabled) return;
            btn.disabled = true;
            if (spinner) spinner.classList.remove('hidden');
            if (icon) icon.classList.add('hidden');
            if (text) text.textContent = 'Connecting...';
            hideError();

            if (!auth) {
                showError('Firebase not configured. Please add your API key.');
                resetGoogleBtn(); return;
            }

            try {
                const provider = new GoogleAuthProvider();
                const cred = await signInWithPopup(auth, provider);
                const idToken = await cred.user.getIdToken();
                const res = await fetch('/api/sessionLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idToken,
                        email: cred.user && cred.user.email ? cred.user.email : '',
                        displayName: cred.user && cred.user.displayName ? cred.user.displayName : '',
                        photoURL: cred.user && cred.user.photoURL ? cred.user.photoURL : ''
                    })
                });
                if (res.ok) { 
                    window.location.href = '/'; 
                } else { 
                    const d = await res.json().catch(()=>({})); 
                    showError(d.error || 'Google login failed.'); 
                    resetGoogleBtn();
                }
            } catch (err) {
                console.error('Google Sign-In Error:', err);
                if (err.code !== 'auth/popup-closed-by-user') {
                    let msg = err.message || 'Google signup failed.';
                    if (err.code === 'auth/popup-blocked') msg = 'Popup blocked! Please allow popups.';
                    showError(msg);
                }
                resetGoogleBtn();
            }

            function resetGoogleBtn() {
                btn.disabled = false;
                if (spinner) spinner.classList.add('hidden');
                if (icon) icon.classList.remove('hidden');
                if (text) text.textContent = 'Continue with Google';
            }
        });
    </script>
</body>
</html>
