<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register | TrustLens AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#26eded",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0a0a0a",
                        "card-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <!-- Header/Navigation -->
            <header class="flex items-center justify-between border-b border-primary/10 px-6 py-4 lg:px-20">
                <div class="flex items-center gap-3">
                    <div class="size-8 flex items-center justify-center bg-primary/10 rounded-lg text-primary">
                        <span class="material-symbols-outlined text-2xl">lens_blur</span>
                    </div>
                    <h2 class="text-xl font-bold leading-tight tracking-tight">TrustLens AI</h2>
                </div>
                <div class="hidden md:flex gap-6">
                    <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Platform</a>
                    <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Ethics</a>
                    <a class="text-sm font-medium hover:text-primary transition-colors" href="#">Security</a>
                </div>
            </header>
            <main class="flex flex-1 items-center justify-center p-6">
                <div class="w-full max-w-[480px] space-y-8">
                    <!-- Title Section -->
                    <div class="text-center space-y-2">
                        <h1 class="text-4xl font-black tracking-tight text-slate-900 dark:text-white">Create Account
                        </h1>
                        <p class="text-slate-600 dark:text-primary/60 text-base">Join the future of AI transparency</p>
                    </div>
                    <!-- Registration Form -->
                    <div
                        class="bg-slate-100 dark:bg-white/5 p-8 rounded-xl border border-slate-200 dark:border-primary/10 shadow-xl backdrop-blur-sm dark:bg-card-dark">
                        <form class="space-y-5" onsubmit="return false;">
                            <!-- Name -->
                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Full
                                    Name</label>
                                <div class="relative">
                                    <span
                                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
                                    <input
                                        class="w-full pl-12 pr-4 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600"
                                        placeholder="John Doe" type="text" />
                                </div>
                            </div>
                            <!-- Email -->
                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Email
                                    Address</label>
                                <div class="relative">
                                    <span
                                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                                    <input
                                        class="w-full pl-12 pr-4 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600"
                                        placeholder="name@example.com" type="email" />
                                </div>
                            </div>
                            <!-- Password -->
                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
                                <div class="relative flex items-center">
                                    <span
                                        class="material-symbols-outlined absolute left-4 text-slate-400 text-xl">lock</span>
                                    <input
                                        class="w-full pl-12 pr-4 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600"
                                        placeholder="••••••••" type="password" />
                                    <button class="absolute right-4 text-slate-400 hover:text-primary transition-colors"
                                        type="button">
                                        <span class="material-symbols-outlined text-xl">visibility</span>
                                    </button>
                                </div>
                            </div>
                            <!-- Confirm Password -->
                            <div class="flex flex-col gap-2">
                                <label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Confirm
                                    Password</label>
                                <div class="relative">
                                    <span
                                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">shield_lock</span>
                                    <input
                                        class="w-full pl-12 pr-4 py-3.5 rounded-lg bg-white dark:bg-background-dark border border-slate-300 dark:border-primary/20 focus:ring-2 focus:ring-primary focus:border-transparent text-slate-900 dark:text-white transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600"
                                        placeholder="••••••••" type="password" />
                                </div>
                            </div>
                            <!-- Submit Button -->
                            <button
                                class="w-full py-4 px-6 bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 group"
                                type="submit">
                                Create Account
                                <span
                                    class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                            </button>
                        </form>
                        <div class="mt-8 pt-6 border-t border-slate-200 dark:border-primary/10 text-center">
                            <p class="text-slate-600 dark:text-slate-400 text-sm">
                                Already have an account?
                                <a class="text-primary font-bold hover:underline underline-offset-4 ml-1"
                                    href="{{ url_for('login') }}">Login here</a>
                            </p>
                        </div>
                    </div>
                    <!-- Terms -->
                    <p class="text-center text-xs text-slate-500 dark:text-slate-600 max-w-xs mx-auto">
                        By clicking register, you agree to our
                        <a class="underline" href="#">Terms of Service</a> and
                        <a class="underline" href="#">Privacy Policy</a>.
                    </p>
                </div>
            </main>
            <!-- Footer Decoration -->
            <footer class="p-6 text-center">
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 bg-primary/5 rounded-full border border-primary/10">
                    <div class="size-2 bg-primary rounded-full animate-pulse"></div>
                    <span class="text-[10px] uppercase tracking-widest font-bold text-primary/80">Secured by TrustLens
                        Protocol</span>
                </div>
            </footer>
        </div>
    </div>
    <!-- Background Decoration -->
    <div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
        <div class="absolute top-[20%] -right-[5%] w-[30%] h-[50%] bg-primary/5 blur-[100px] rounded-full"></div>
    </div>
</body>

</html>
